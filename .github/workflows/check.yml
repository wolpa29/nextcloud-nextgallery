name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix nextcloud-app/media_ai/worker/lmstudio
      - run: node --test tests/lmstudio_transport.test.mjs
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.2 syntax and contract checks
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" php:8.2-cli sh -ec '
            for file in $(find /work/nextcloud-app -name "*.php"); do php -l "$file"; done
            php /work/tests/php_contract.php
            php /work/tests/php_settings.php
            php /work/tests/php_worker.php
            php /work/tests/php_media.php
            php /work/tests/php_model_connection.php
            php /work/tests/php_admin.php
            php /work/tests/php_preferences.php
          '
